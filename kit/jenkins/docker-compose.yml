# ==============================================================================
# Jenkins CI/CD Controller + Smee.io Webhook Relay Stack
# Universidad Icesi - Ingeniería de Software V
# ==============================================================================
# Este Docker Compose despliega:
# 1. Jenkins Controller (LTS JDK 17) con herramientas de compilación (Maven, Git)
#    y acceso seguro al daemon de Docker para compilar y publicar imágenes OCI.
# 2. Smee.io Relay Client: Contenedor emparejado que escucha eventos SSE
#    desde GitHub.com y los reenvía por HTTP POST local a Jenkins.
# ==============================================================================

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-998}
    image: jenkins-cicd-icesi:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    ports:
      # Puerto HTTP de Jenkins (UI, API y Webhook endpoint)
      - "${JENKINS_PORT:-8080}:8080"
      # Puerto para agentes inbound remotos JNLP
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=true -Duser.timezone=America/Bogota
    group_add:
      - 0
      - ${DOCKER_GID:-998}
    volumes:
      # Persistencia de configuración, credenciales y jobs
      - jenkins_home:/var/jenkins_home
      # Acceso al socket de Docker para construir y empujar imágenes
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cicd_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

  smee:
    build:
      context: ./smee
      dockerfile: Dockerfile
    image: smee-client-relay:latest
    container_name: smee-client
    restart: unless-stopped
    depends_on:
      - jenkins
    environment:
      - SMEE_URL=${SMEE_URL:-https://smee.io/REEMPLAZAR_CON_TU_CANAL}
      - SMEE_TARGET=${SMEE_TARGET:-http://jenkins:8080/github-webhook//}
    command: ["-u", "${SMEE_URL}", "-t", "${SMEE_TARGET:-http://jenkins:8080/github-webhook//}"]
    networks:
      - cicd_net

volumes:
  jenkins_home:
    name: jenkins_home

networks:
  cicd_net:
    name: cicd_network
